{% extends 'dashboard/base.html' %}
{% block content %}

<div class="container">
  <div class="row justify-content-center">
    <div class="col-lg-6 col-md-8">
      <div class="form-card">
        <div class="form-card-header">
          <p class="eyebrow">Start studying smarter</p>
          <h2>Create Account</h2>
          <p class="text-muted mb-0">Create a secure account to keep your study data private.</p>
        </div>
      <form method="post" novalidate>
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit" class="btn btn-primary btn-block">Join Portal</button>
      </form>
      <div class="form-card-footer">
        <span>Already have an account?</span>
        <a href="{% url 'login' %}">Log in</a>
      </div>
      </div>
    </div>
  </div>
</div>

{% endblock content %}
